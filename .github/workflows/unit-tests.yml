name: Unit Tests

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Debug environment
      run: |
        pwd
        ls -R
        python --version
        python -c "import os; print(os.getcwd())"
        python -c "import sys; print(sys.path)"
        python -c "import ml; print(ml.__file__)"

    - name: Show test file
      run: |
        sed -n '1,50p' ml/tests/test_preprocessing.py  

    - name: Run tests
      run: |
        pytest