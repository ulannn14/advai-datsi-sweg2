name: Unit Tests

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.0.0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest ml/tests/test_preprocessing.py -v
          python -m pytest ml/tests/test_clustering.py -v
          python -m pytest ml/tests/test_machinelearning.py -v

      - name: Run system tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest ml/tests/test_integration.py -v

      - name: Released artifacts
        run: |
          zip -r release-${{ env.VERSION }}.zip \
            ml/scripts/ \
            ml/tests/ \
            ml/datasets/ \
            requirements.txt \
            "ml/notebooks/ADVAI Version/CBADVAI_Group2_MCO.ipynb" \
            "ml/notebooks/DATSI Version/CBDATSI_Project_X40_Group4.ipynb"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-${{ env.VERSION }}.zip
          tag_name: ${{ env.VERSION }}
          overwrite: true